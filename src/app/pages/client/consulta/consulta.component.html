<div class="client_page">
  <div class="client_content">
    @if (whatsappPendente.pendente(); as p) {
      <div class="pendente_alert">
        <span>Há uma mensagem de WhatsApp da sua reserva que ainda não foi enviada ao estacionamento.</span>
        <button type="button" class="pendente_btn" (click)="retomarEnvio()">Enviar agora</button>
      </div>
    }

    <div class="availability_card">
      <div class="card_content">
        @if (errorMessage()) {
          <div class="error_alert">
            {{ errorMessage() }}
          </div>
        }
        <h2 class="section_title">Escolha o período</h2>
      </div>

      <form
        class="availability_form"
        [formGroup]="availabilityForm"
        (ngSubmit)="continue()"
      >
        <!-- ENTRADA -->
        <div class="period_section">
          <div class="period_label">
            <img class="label_icon" src="assets/icons/calendar.icon.svg" alt="" />
            <span>Entrada</span>
          </div>
          <div class="period_row">
            <div class="input_group">
              <label class="input_label">Data</label>
              <input type="date" class="input_field" formControlName="entryDate" [min]="minDateToday" />
            </div>
            <div class="input_group">
              <label class="input_label">Horário</label>
              <input type="time" class="input_field" formControlName="entryTime" />
            </div>
          </div>
        </div>

        <!-- SAÍDA -->
        <div class="period_section">
          <div class="period_label">
            <img class="label_icon" src="assets/icons/calendar.icon.svg" alt="" />
            <span>Saída</span>
          </div>
          <div class="period_row">
            <div class="input_group">
              <label class="input_label">Data</label>
              <input type="date" class="input_field" formControlName="exitDate" [min]="minDateToday" />
            </div>
            <div class="input_group">
              <label class="input_label">Horário</label>
              <input type="time" class="input_field" formControlName="exitTime" />
            </div>
          </div>
        </div>

        <div class="primary_action">
          <app-landing-button
            [label]="isLoading() ? 'Verificando...' : 'Continuar'"
            variant="primary"
            [fullWidth]="true"
            [disabled]="availabilityForm.invalid || isLoading()"
            (clicked)="continue()"
          ></app-landing-button>
          <app-landing-button
            label="Já tenho uma reserva"
            variant="outline"
            [fullWidth]="true"
            (clicked)="irParaMinhaReserva()"
          ></app-landing-button>
        </div>
      </form>
    </div>
  </div>
</div>
